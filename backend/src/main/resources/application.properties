spring.application.name=poultry-management

# =======================================================
# MySQL Database Configuration
# Render: set DB_URL, DB_USERNAME, DB_PASSWORD as env vars
# =======================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================================================
# HikariCP Memory Optimization (for Render 512MB RAM)
# Restricts connection pool to conserve JVM heap
# =======================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# =======================================================
# JPA / Hibernate Configuration
# =======================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

# =======================================================
# JWT Security
# =======================================================
jwt.secret=${JWT_SECRET:MyVeryLongDevelopmentSecretKeyForPoultryManagement2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =======================================================
# AI / LLM Configuration (Chat Model)
# Supported providers: groq, gemini, openai, openrouter, ollama
# Set AI_API_KEY as env var on Render
# =======================================================
ai.provider=${AI_PROVIDER:groq}
ai.api-key=${AI_API_KEY:YOUR_GROQ_API_KEY_HERE}
ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
ai.model-name=${AI_MODEL:qwen/qwen3.8-27b}
ai.temperature=${AI_TEMPERATURE:0.2}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
ai.rag.max-results=4
ai.rag.min-score=0.35

# =======================================================
# Remote Embedding Model Configuration (RAG)
# Supported providers: openai (default), gemini, remote
# Set EMBEDDING_API_KEY as env var on Render if using remote embeddings
# If unset or unavailable, gracefully falls back to zero-memory lexical vectors
# =======================================================
ai.embedding.provider=${EMBEDDING_PROVIDER:openai}
ai.embedding.api-key=${EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
ai.embedding.base-url=${EMBEDDING_BASE_URL:}
ai.embedding.model-name=${EMBEDDING_MODEL:text-embedding-3-small}
ai.embedding.dimensions=${EMBEDDING_DIMENSIONS:384}
