spring.application.name=poultry-management

# =======================================================
# MySQL Database Configuration
# Render: set DB_URL, DB_USERNAME, DB_PASSWORD as env vars
# Local dev fallback: jdbc:mysql://localhost:3306/poultry_management
# =======================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/poultry_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================================================
# JPA / Hibernate Configuration
# =======================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =======================================================
# JWT Security
# =======================================================
jwt.secret=${JWT_SECRET:MyVeryLongDevelopmentSecretKeyForPoultryManagement2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =======================================================
# AI / LLM Configuration (LangChain4j)
# Supported providers: groq, gemini, openai, openrouter, ollama
# Set AI_API_KEY as env var on Render
# =======================================================
ai.provider=${AI_PROVIDER:groq}
ai.api-key=${AI_API_KEY:YOUR_GROQ_API_KEY_HERE}
ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
ai.model-name=${AI_MODEL:qwen/qwen3.8-27b}
ai.temperature=${AI_TEMPERATURE:0.2}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
ai.rag.max-results=4
ai.rag.min-score=0.35
