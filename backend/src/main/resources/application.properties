spring.application.name=poultry-management

# =======================================================
# MySQL Database Configuration
# =======================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/poultry_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# =======================================================
# JPA / Hibernate Configuration
# =======================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =======================================================
# JWT Security
# =======================================================
jwt.secret=${JWT_SECRET:MyVeryLongDevelopmentSecretKeyForPoultryManagement2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =======================================================
# AI / LLM Configuration (LangChain4j Autonomous Agent)
# =======================================================
# Supported Providers:
#   - gemini     (Google AI Studio: https://aistudio.google.com)
#   - openai     (OpenAI Platform: https://platform.openai.com)
#   - groq       (Groq Cloud: https://console.groq.com)
#   - openrouter (OpenRouter: https://openrouter.ai)
#   - ollama     (Local LLM: http://localhost:11434)
#
# HOW TO CONFIGURE YOUR API KEY:
# 1. For Google Gemini:
#      ai.provider=gemini
#      ai.api-key=AIzaSy... (Paste your Gemini API key here)
#      ai.model-name=gemini-1.5-flash
#      ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
#
# 2. For OpenAI:
#      ai.provider=openai
#      ai.api-key=sk-... (Paste your OpenAI API key here)
#      ai.model-name=gpt-4o-mini
#      ai.base-url=https://api.openai.com/v1
#
# 3. For Groq:
#      ai.provider=groq
#      ai.api-key=gsk_... (Paste your Groq API key here)
#      ai.model-name=llama-3.3-70b-versatile
#      ai.base-url=https://api.groq.com/openai/v1
# =======================================================
# =======================================================
# Active AI / LLM Configuration (Groq Cloud)
# =======================================================
ai.provider=${AI_PROVIDER:groq}
ai.api-key=${AI_API_KEY:YOUR_GROQ_API_KEY_HERE}
ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
ai.model-name=${AI_MODEL:qwen/qwen3.8-27b}
ai.temperature=${AI_TEMPERATURE:0.2}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
ai.rag.max-results=4
ai.rag.min-score=0.35
