spring.application.name=poultry-management

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/poultry_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Security
jwt.secret=${JWT_SECRET:MyVeryLongDevelopmentSecretKeyForPoultryManagement2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Deterministic Test AI Configuration (Ensures 100% reliable assertions without external rate limits)
ai.provider=offline
ai.api-key=demo-api-key
ai.model-name=offline
ai.temperature=0.0
