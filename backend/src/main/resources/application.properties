spring.application.name=poultry-management

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/poultry_management
spring.datasource.username=root
spring.datasource.password=root

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# JWT
# ===============================
jwt.secret=MyVeryLongDevelopmentSecretKeyForPoultryManagement2026
jwt.expiration-ms=86400000

# ===============================
# AI / LLM Configuration (LangChain4j)
# ===============================
ai.provider=${AI_PROVIDER:openai}
ai.api-key=${AI_API_KEY:demo-api-key}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.model-name=${AI_MODEL:gpt-4o-mini}
ai.temperature=${AI_TEMPERATURE:0.2}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
ai.rag.max-results=${AI_RAG_MAX_RESULTS:4}
ai.rag.min-score=${AI_RAG_MIN_SCORE:0.60}